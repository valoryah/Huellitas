<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iniciar Sesión</title>
        <link rel="stylesheet" href="Huellitas/assets/css/login.css">
    </head>
    <body>
        <div class="login">
            <img src="Huellitas/assets/img/logo/logo.png" class="logo">
            <h1>Bienvenido</h1>
            <p>Inicia sesión para continuar</p>
            <input
            type="email"
            id="correo"
            placeholder="Correo electrónico">
            <div class="password">
                <input
                type="password"
                id="password"
                placeholder="Contraseña">
                <button id="mostrar">
                </button>
            </div>
            <div class="recordar"></div>
            <input type="checkbox">
            <label>Recordarme</label>
        </div>
        <button id="ingresar">
            Iniciar sesión
        </button>
        <p>
            ¿No tienes cuanta?
            <a href="registro.html">
                Registrarse
            </a>
        </p>
         </div>
         <script src="Huellitas/assets/js/login.js"></script>
    </body>
</html>
